<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#17181B;
    --surface:#202226;
    --surface-2:#2A2D33;
    --hairline:#34373D;
    --hairline-strong:#42464D;
    --text:#ECEDEF;
    --text-muted:#8B8F97;
    --text-faint:#5B5F66;
    --lume:#C6EE7E;
    --lume-ink:#12140E;
    --lume-soft:rgba(198,238,126,0.14);
    --steel:#6C9CB8;
    --steel-soft:rgba(108,156,184,0.14);
    --danger:#D9807E;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#0E0F11;
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:440px;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--lume);outline-offset:2px;}

  /* header */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem 1.25rem 0.9rem;
    border-bottom:1px solid var(--hairline);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:0.14em;
    color:var(--text);
  }
  .brand span{color:var(--lume);}
  .header-date{
    font-family:var(--font-mono);
    font-size:0.8rem;
    color:var(--text-muted);
  }

  .storage-warning{
    display:none;
    align-items:center;
    gap:0.5rem;
    padding:0.55rem 1.1rem;
    background:rgba(217,128,126,0.12);
    border-bottom:1px solid var(--danger);
    color:var(--danger);
    font-size:0.78rem;
    line-height:1.3;
  }
  .storage-warning svg{flex-shrink:0;}

  /* panels */
  .panels{flex:1;overflow:hidden;position:relative;}
  .panel{
    display:none;
    padding:1.1rem 1.25rem 1.5rem;
    height:100%;
    overflow-y:auto;
  }
  .panel.active{display:block;}

  /* dial badge */
  .dial-wrap{display:flex;justify-content:center;margin:0.6rem 0 1.4rem;}
  .dial-badge{width:132px;height:132px;}

  /* cards */
  .card{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:1.1rem 1.1rem 1.2rem;
    margin-bottom:1.1rem;
  }
  .card h2{
    font-family:var(--font-display);
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 0.9rem;
  }

  /* forms */
  label{
    display:block;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:0.35rem;
  }
  input[type="date"], input[type="text"], select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:0.7rem 0.8rem;
    color:var(--text);
    font-size:0.95rem;
    margin-bottom:0.9rem;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M2 5 L7 10 L12 5' stroke='%238B8F97' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 0.8rem center;
    padding-right:2.2rem;
  }
  select:invalid{color:var(--text-muted);}
  input[type="date"]{
    color-scheme:dark;
    min-height:2.9rem;
    line-height:1.5;
    -webkit-appearance:none;
    appearance:none;
  }

  .btn-primary{
    width:100%;
    background:var(--lume);
    color:var(--lume-ink);
    border:none;
    border-radius:999px;
    padding:0.85rem 1rem;
    font-family:var(--font-display);
    font-weight:700;
    font-size:0.95rem;
    letter-spacing:0.02em;
    transition:transform 0.1s ease, opacity 0.15s ease;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:0.35;pointer-events:none;}

  .btn-secondary{
    background:transparent;
    border:1px solid var(--steel);
    color:var(--steel);
    border-radius:999px;

  .ci-controls{display:flex;align-items:center;gap:0.55rem;margin-top:0.65rem;flex-wrap:wrap;}
  .row-main{display:flex;align-items:center;gap:0.65rem;flex:1;min-width:0;}
  .watch-badge{flex-shrink:0;display:block;}

    background:none;
    border:none;
    border-bottom:1px solid transparent;
    padding:0 0 0.1rem;
    margin:0;
    font-size:0.9rem;
    font-family:var(--font-body);
    color:var(--text);
    border-radius:0;
    resize:none;
    overflow:hidden;
    white-space:normal;
    word-break:break-word;
    line-height:1.3;
    height:auto;
    min-height:3.9em;

  .collection-list .name-input:hover{border-bottom-color:var(--hairline-strong);}
  .collection-list .name-input:focus{border-bottom-color:var(--lume);outline:none;}

  .pager-btn{

    border:1px solid var(--hairline);
    color:var(--text);
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    line-height:1;
    padding:0;

  .pager-btn:disabled{opacity:0.3;pointer-events:none;}

    font-size:0.76rem;
    color:var(--text-muted);

  .icon-btn{

    padding:0.3rem;line-height:0;flex-shrink:0;

  const d = new Date();
  const tz = d.getTimezoneOffset();
  const local = new Date(d.getTime() - tz*60000);
  return local.toISOString().slice(0,10);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

// When running inside Claude, window.storage exists and is used (syncs, and
// gets the retry/banner treatment below if it ever fails). When this file is
// opened directly — a downloaded copy, double-clicked, opened from Files —
// window.storage doesn't exist at all, so everything below falls back to the
// browser's own localStorage instead. Same file, works either way.
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function storageGet(key){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

let pendingRetry = null;
let storageWarningShown = false;

function showStorageWarning(){
  storageWarningShown = true;
  const el = document.getElementById('storageWarning');
  if(el) el.style.display = 'flex';
}
function hideStorageWarning(){
  storageWarningShown = false;
  const el = document.getElementById('storageWarning');
  if(el) el.style.display = 'none';
}

function scheduleStorageRetry(){
  if(pendingRetry) return;
  pendingRetry = setTimeout(async () => {
    pendingRetry = null;
    const okEntries = await rawStorageSet(KEYS.entries, state.entries);
    const okCollection = await rawStorageSet(KEYS.collection, state.collection);
    if(okEntries && okCollection){
      hideStorageWarning();
    } else {
      scheduleStorageRetry();
    }
  }, 4000);
}

async function rawStorageSet(key, value){
  if(hasClaudeStorage){
    try{
      await window.storage.set(key, JSON.stringify(value), false);
      return true;
    }catch(e){
      console.error('storage set failed', key, e);
      return false;
    }
  }
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('localStorage set failed', key, e);
    return false;
  }
}

// storageSet always keeps your change in memory and moves on — a failed save
// here no longer rolls anything back. Because every write sends the FULL
// current entries/collection (not a diff), the next write that succeeds
// (whether from you making another change, or the background retry below)
// catches up everything that came before it, so nothing is lost as long as
// storage recovers eventually. This also means the app stays fully usable
// even while storage is down, instead of blocking every action.
async function storageSet(key, value){
  const ok = await rawStorageSet(key, value);
  if(!ok){
    showStorageWarning();
    scheduleStorageRetry();
  } else if(storageWarningShown && !pendingRetry){
    hideStorageWarning();
  }
  return ok;
}

async function loadState(){
  let entries = await storageGet(KEYS.entries);
  let rawCollection = await storageGet(KEYS.collection);
  let needsSave = false;
  if(!entries){
    entries = SEED.entries.map(e => Object.assign({id: uid()}, e));
    needsSave = true;
  }
  if(!rawCollection){
    rawCollection = SEED.collection.slice();
    needsSave = true;
  }
  const { collection, migrated } = normalizeCollection(rawCollection);
  state.entries = entries;
  state.collection = collection;
  if(needsSave || migrated){
    await storageSet(KEYS.entries, state.entries);
    await storageSet(KEYS.collection, state.collection);
  }
}

function isDigitalGuess(name){
  return /casio|g-shock|g shock/i.test(name);
}

function normalizeCollection(raw){
  let migrated = false;
  const names = raw.map(x => typeof x === 'string' ? x : x.name).slice().sort((a,b)=>a.localeCompare(b));
  const collection = raw.map(x => {
    const name = typeof x === 'string' ? x : x.name;
    const idx = names.indexOf(name);
    if(typeof x === 'string' || !x.color || !x.shape || typeof x.active === 'undefined'){
      migrated = true;
    }
    return {
      name,
      color: (typeof x === 'object' && x.color) || PALETTE[idx % PALETTE.length],
      shape: (typeof x === 'object' && x.shape === 'digital') ? 'digital' : ((typeof x === 'object' && x.shape === 'analog') ? 'analog' : (isDigitalGuess(name) ? 'digital' : 'analog')),
      active: (typeof x === 'object' && typeof x.active !== 'undefined') ? x.active !== false : true
    };
  });
  return { collection, migrated };
}

function styleFor(name){
  const w = state.collection.find(c => c.name === name);
  if(w) return { color: w.color, shape: w.shape };
  return { color: '#5B5F66', shape: isDigitalGuess(name) ? 'digital' : 'analog' };
}

function computeStats(){
  const counts = {};
  state.entries.forEach(e => counts[e.watch] = (counts[e.watch]||0) + 1);
  state.collection.forEach(w => { if(w.active && !(w.name in counts)) counts[w.name] = 0; });
  const total = state.entries.length;
  const rows = Object.entries(counts).map(([watch,count]) => ({
    watch, count, pct: total ? (count/total)*100 : 0
  }));
  rows.sort((a,b) => b.count - a.count || a.watch.localeCompare(b.watch));
  return { rows, total };
}

function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  const dt = new Date(Number(y), Number(m)-1, Number(d));
  return dt.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

function toDateObj(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}
function toIso(dateObj){
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth()+1).padStart(2,'0');
  const d = String(dateObj.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function addDays(iso, delta){
  const d = toDateObj(iso);
  d.setDate(d.getDate() + delta);
  return toIso(d);
}
function fmtShort(iso){
  return toDateObj(iso).toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function fmtRangeLabel(start, end){
  const startYear = toDateObj(start).getFullYear();
  const endYear = toDateObj(end).getFullYear();
  if(startYear === endYear){
    return `${fmtShort(start)} – ${fmtShort(end)}, ${endYear}`;
  }
  return `${fmtShort(start)}, ${startYear} – ${fmtShort(end)}, ${endYear}`;
}

let historyPage = 0;

function pageWindow(pageIndex){
  const end = addDays(todayStr(), -30*pageIndex);
  const start = addDays(end, -29);
  return { start, end };
}

function maxHistoryPage(){
  if(state.entries.length === 0) return 0;
  const oldest = state.entries.reduce((min,e) => e.date < min ? e.date : min, state.entries[0].date);
  const diffDays = Math.round((toDateObj(todayStr()) - toDateObj(oldest)) / 86400000);
  return Math.max(0, Math.floor(diffDays/30));
}

/* ---------- render: header ---------- */
function renderHeader(){
  document.getElementById('headerDate').textContent = fmtDate(todayStr());
}

function updateClock(){
  const hourEl = document.getElementById('hourHand');
  const minuteEl = document.getElementById('minuteHand');
  const secondEl = document.getElementById('secondHand');
  if(!hourEl || !minuteEl || !secondEl) return;

  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();

  const hourAngle = (h + m/60) * 30;
  const minuteAngle = (m + s/60) * 6;
  const secondAngle = s * 6;

  // Driven directly from JS rather than a CSS animation-delay trick — Safari
  // has been unreliable about actually running long-lived CSS animations on
  // these SVG hands (the 60s second-hand loop is the one where a stall is
  // visible; the hour/minute hands move too slowly for a stall to be
  // noticeable, which is why only the second hand looked frozen). Setting
  // the SVG transform attribute directly, once a second, sidesteps that
  // entirely and behaves identically in every browser.
  hourEl.setAttribute('transform', `rotate(${hourAngle} 0 0)`);
  minuteEl.setAttribute('transform', `rotate(${minuteAngle} 0 0)`);
  secondEl.setAttribute('transform', `rotate(${secondAngle} 0 0)`);
}

let clockInterval = null;

function startClock(){
  updateClock();
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion){
    if(clockInterval) clearInterval(clockInterval);
    clockInterval = setInterval(updateClock, 1000);
  }
}

/* ---------- render: watch select options ---------- */
function updateWatchOptions(){
  const sel = document.getElementById('watchSelect');
  const current = sel.value;
  const sorted = state.collection.filter(w => w.active).map(w => w.name).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '<option value="" disabled selected>Choose a watch</option>' +
    sorted.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
  if(sorted.includes(current)) sel.value = current;
}

/* ---------- render: today ---------- */
function renderToday(){
  const list = document.getElementById('historyList');
  const pagerWrap = document.getElementById('historyPager');
  const panel = document.getElementById('panel-today');
  const prevScroll = panel ? panel.scrollTop : 0;
  const maxPage = maxHistoryPage();
  if(historyPage > maxPage) historyPage = maxPage;
  if(historyPage < 0) historyPage = 0;

  if(state.entries.length === 0){
    list.innerHTML = '<li class="empty-state" style="display:block;">No entries yet. Log your first watch above.</li>';
    pagerWrap.innerHTML = '';
    pagerWrap.style.display = 'none';
    if(panel) panel.scrollTop = prevScroll;
    return;
  }

  const { start, end } = pageWindow(historyPage);
  const inRange = state.entries
    .filter(e => e.date >= start && e.date <= end)
    .slice()
    .sort((a,b) => b.date.localeCompare(a.date));

  if(inRange.length === 0){
    list.innerHTML = '<li class="empty-state" style="display:block;">Nothing logged in this range.</li>';
  } else {
    list.innerHTML = inRange.map(e => `
      <li>
        <div class="row-main">
          ${watchBadge(e.watch, 32)}
          <div class="hl-left">
            <span class="hl-date">${fmtDate(e.date)}</span>
            <span class="hl-watch">${escapeHtml(e.watch)}</span>
          </div>
        </div>
        <button class="icon-btn" data-del="${e.id}" aria-label="Delete entry">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10"/><path d="M6.5 4.5V3.2c0-.4.3-.7.7-.7h1.6c.4 0 .7.3.7.7v1.3"/><path d="M4.2 4.5l.5 8c0 .5.5.9 1 .9h4.6c.5 0 .9-.4 1-.9l.5-8"/></svg>
        </button>
      </li>
    `).join('');
  }

  if(maxPage === 0){
    pagerWrap.style.display = 'none';
    pagerWrap.innerHTML = '';
  } else {
    pagerWrap.style.display = 'flex';
    pagerWrap.innerHTML = `
      <button id="pagerNewer" class="pager-btn" ${historyPage===0 ? 'disabled' : ''} aria-label="Newer 30 days">‹</button>
      <span class="pager-label">${fmtRangeLabel(start,end)}</span>
      <button id="pagerOlder" class="pager-btn" ${historyPage>=maxPage ? 'disabled' : ''} aria-label="Older 30 days">›</button>
    `;
  }
  if(panel) panel.scrollTop = prevScroll;
}

function miniShapeIcon(shape){

    return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="2.4"/><line x1="4.6" y1="8" x2="11.4" y2="8" stroke-linecap="round"/></svg>`;
  }
  return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M8 8V4.6" stroke-linecap="round"/><path d="M8 8L10.6 9.6" stroke-linecap="round"/></svg>`;
}

function collectionRow(w, count){
  return `
    <li data-watch-row="${escapeHtml(w.name)}" class="${w.active ? '' : 'inactive'}">
      <div class="ci-top">

          </div>
        </div>
        <div class="cl-right">

            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10"/><path d="M6.5 4.5V3.2c0-.4.3-.7.7-.7h1.6c.4 0 .7.3.7.7v1.3"/><path d="M4.2 4.5l.5 8c0 .5.5.9 1 .9h4.6c.5 0 .9-.4 1-.9l.5-8"/></svg>

          <button type="button" class="shape-btn ${w.shape === 'digital' ? 'active' : ''}" data-shape-set="digital" data-watch="${escapeHtml(w.name)}" aria-label="Use digital icon">${miniShapeIcon('digital')}</button>
        </div>

        <button type="button" class="active-toggle ${w.active ? 'is-on' : ''}" data-toggle-active="${escapeHtml(w.name)}" aria-pressed="${w.active ? 'true' : 'false'}">
          <span class="switch"></span>
          <span class="switch-label">In collection</span>

/* ---------- render: collection ---------- */
function renderCollection(){
  const list = document.getElementById('collectionList');
  const panel = document.getElementById('panel-collection');
  const prevScroll = panel ? panel.scrollTop : 0;
  updateCollectionSummary();

  const countByName = {};
  state.entries.forEach(e => countByName[e.watch] = (countByName[e.watch]||0) + 1);

  if(state.collection.length === 0){
    list.innerHTML = '<li class="empty-state" style="display:block;">No watches yet — add your first one above.</li>';
    if(panel) panel.scrollTop = prevScroll;
    return;
  }

  // Sorted purely alphabetically, independent of active status, so toggling a
  // watch's "in collection" state never moves its row — only its own styling
  // changes. (Grouping active/inactive into separate sections previously meant
  // a toggle could relocate a row across the whole list, which is what caused
  // the scroll position to jump or the list to appear to collapse.)
  const sorted = state.collection.slice().sort((a,b) => a.name.localeCompare(b.name));
  const html = sorted.map(w => collectionRow(w, countByName[w.name])).join('');
  list.innerHTML = html;
  if(panel) panel.scrollTop = prevScroll;
}

/* ---------- render: stats ---------- */
function renderStats(){
  const { rows, total } = computeStats();
  const worn = rows.filter(r => r.count > 0);
  const unworn = rows.filter(r => r.count === 0);

  const distinctWorn = worn.length;
  const activeCount = state.collection.filter(w => w.active).length;
  document.getElementById('statsSummary').innerHTML = `
    <div class="stat-block"><div class="stat-num">${total}</div><div class="stat-label">Logged</div></div>
    <div class="stat-block"><div class="stat-num">${distinctWorn}</div><div class="stat-label">Worn</div></div>
    <div class="stat-block"><div class="stat-num">${activeCount}</div><div class="stat-label">In collection</div></div>
  `;

  /* donut */
  const donutWrap = document.getElementById('donutWrap');
  const r = 74, cx = 92, cy = 92, sw = 24;
  const circumference = 2 * Math.PI * r;
  let running = 0;
  let circles = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#34373D" stroke-width="${sw}"/>`;
  worn.forEach(row => {
    const dash = (row.pct/100) * circumference;
    const offset = circumference * (1 - running/100);
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${styleFor(row.watch).color}"
      stroke-width="${sw}" stroke-dasharray="${dash} ${circumference-dash}"
      stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    running += row.pct;
  });
  donutWrap.innerHTML = `
    <svg viewBox="0 0 ${cx*2} ${cy*2}">${circles}</svg>
    <div class="donut-center">
      <div class="num">${total}</div>
      <div class="lbl">wears logged</div>
    </div>
  `;

  /* legend */
  const legend = document.getElementById('donutLegend');
  let legendHtml = worn.map(row => `
    <li>
      <span class="dot" style="background:${styleFor(row.watch).color}"></span>
      <span class="legend-name">${escapeHtml(row.watch)}</span>
      <span class="legend-pct">${row.pct.toFixed(1)}%</span>
      <span class="legend-count">${row.count}&times;</span>
    </li>
  `).join('');
  if(unworn.length){
    legendHtml += `<li style="border-bottom:none;padding-top:0.7rem;"><span class="legend-name dim" style="font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;">Not yet worn</span></li>`;
    legendHtml += unworn.map(row => `
      <li>
        <span class="dot empty"></span>
        <span class="legend-name dim">${escapeHtml(row.watch)}</span>
        <span class="legend-pct">—</span>
        <span class="legend-count">0</span>
      </li>
    `).join('');
  }
  legend.innerHTML = legendHtml || '<li class="empty-state" style="display:block;border:none;">Log a few wears to see your breakdown.</li>';

  /* bar list */
  const barList = document.getElementById('barList');
  const maxCount = Math.max(1, ...rows.map(r => r.count));
  barList.innerHTML = rows.map(row => `
    <div class="bar-row">
      <div class="bar-top">
        <span class="bar-name">${escapeHtml(row.watch)}</span>
        <span class="bar-count">${row.count}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(row.count/maxCount*100)}%;background:${row.count ? styleFor(row.watch).color : 'transparent'}"></div>
      </div>
    </div>
  `).join('') || '<div class="empty-state">No data yet.</div>';
}

function renderAll(){
  updateWatchOptions();
  renderToday();
  renderCollection();
  renderStats();
}

/* ---------- actions ---------- */
function scheduleRender(fn){
  setTimeout(fn, 0);
}

async function logEntry(){
  const dateInput = document.getElementById('dateInput');
  const watchSelect = document.getElementById('watchSelect');
  const msg = document.getElementById('logMsg');
  const date = dateInput.value || todayStr();
  const watch = watchSelect.value;

  if(!watch){
    msg.textContent = 'Pick a watch first';
    msg.classList.add('err');
    return;
  }
  const dup = state.entries.some(e => e.date === date && e.watch === watch);
  if(dup){
    msg.textContent = `Already logged for ${fmtDate(date)}`;
    msg.classList.add('err');
    return;
  }
  state.entries.push({ id: uid(), date, watch });
  await storageSet(KEYS.entries, state.entries);
  msg.classList.remove('err');
  msg.textContent = `Logged for ${fmtDate(date)}`;
  watchSelect.value = '';
  historyPage = 0;
  scheduleRender(() => { renderToday(); renderCollection(); renderStats(); });
  setTimeout(() => { if(msg.textContent.indexOf('Logged') === 0) msg.textContent = ''; }, 2500);
}

async function deleteEntry(id){
  state.entries = state.entries.filter(e => e.id !== id);
  await storageSet(KEYS.entries, state.entries);
  scheduleRender(() => { renderToday(); renderCollection(); renderStats(); });
}

function showCollectionMsg(text, isErr){
  const el = document.getElementById('collectionMsg');
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
  if(text) setTimeout(() => { if(el.textContent === text) el.textContent = ''; }, 2500);
}

async function addWatch(){
  const input = document.getElementById('addWatchInput');
  const name = input.value.trim();
  if(!name) return;
  const exists = state.collection.some(w => w.name.toLowerCase() === name.toLowerCase());
  if(exists){
    showCollectionMsg('Already in your collection', true);
    input.value='';
    return;
  }
  state.collection.push({
    name,
    color: PALETTE[state.collection.length % PALETTE.length],
    shape: isDigitalGuess(name) ? 'digital' : 'analog',
    active: true
  });
  await storageSet(KEYS.collection, state.collection);
  input.value = '';
  scheduleRender(renderAll);
}

async function renameWatch(oldName, newNameRaw){
  const newName = newNameRaw.trim();
  if(!newName || newName === oldName){ scheduleRender(renderCollection); return; }
  const dup = state.collection.some(w => w.name !== oldName && w.name.toLowerCase() === newName.toLowerCase());
  if(dup){
    showCollectionMsg('Another watch already has that name', true);
    scheduleRender(renderCollection);
    return;
  }
  const w = state.collection.find(c => c.name === oldName);
  if(!w){ scheduleRender(renderCollection); return; }
  w.name = newName;
  state.entries.forEach(e => { if(e.watch === oldName) e.watch = newName; });
  await storageSet(KEYS.collection, state.collection);
  await storageSet(KEYS.entries, state.entries);
  showCollectionMsg('Renamed');
  scheduleRender(renderAll);
}

async function removeWatch(name){
  state.collection = state.collection.filter(w => w.name !== name);
  await storageSet(KEYS.collection, state.collection);
  scheduleRender(renderAll);
  scheduleRender(renderAll);
}

function findCollectionRow(name){
  const rows = document.querySelectorAll('#collectionList li[data-watch-row]');
  for(const r of rows){
    if(r.dataset.watchRow === name) return r;
  }
  return null;
}

function updateCollectionSummary(){
  const el = document.getElementById('collectionCount');
  if(!el) return;
  const activeCount = state.collection.filter(w => w.active).length;
  const inactiveCount = state.collection.length - activeCount;
  el.textContent = activeCount + (activeCount === 1 ? ' watch' : ' watches') + (inactiveCount ? ` · ${inactiveCount} not owned` : '');
}

function replaceBadgeInRow(row, name, size){
  if(!row) return;
  const oldBadge = row.querySelector('.row-main .watch-badge');
  if(!oldBadge) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = watchBadge(name, size);
  oldBadge.replaceWith(wrap.firstElementChild);
}

async function setShape(name, shape){
  const w = state.collection.find(c => c.name === name);
  if(!w || w.shape === shape) return;
  w.shape = shape;
  await storageSet(KEYS.collection, state.collection);
  scheduleRender(() => {
    const row = findCollectionRow(name);
    if(row){
      replaceBadgeInRow(row, name, 34);
      row.querySelectorAll('.shape-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.shapeSet === shape);
      });
    }
    renderHistoryBadgesFor(name);
  });
}

async function setColor(name, hex){
  const w = state.collection.find(c => c.name === name);
  if(!w) return;
  w.color = hex;
  await storageSet(KEYS.collection, state.collection);
  scheduleRender(() => {
    const row = findCollectionRow(name);
    if(row) replaceBadgeInRow(row, name, 34);
    renderHistoryBadgesFor(name);
    renderStats();
  });
}

function renderHistoryBadgesFor(name){
  document.querySelectorAll('#historyList li').forEach(li => {
    const span = li.querySelector('.hl-watch');
    if(span && span.textContent === name) replaceBadgeInRow(li, name, 32);
  });
}

async function setActive(name, active){
  const w = state.collection.find(c => c.name === name);
  if(!w) return;
  w.active = active;
  await storageSet(KEYS.collection, state.collection);
  // Deliberately never touches #collectionList's innerHTML — only this one
  // row's own class/tag change in place. Rebuilding the whole list here was
  // what caused the scroll jump / list collapse when toggling near the bottom.
  // This visual update always runs, regardless of whether the save succeeded —
  // if storage is down, storageSet() shows a persistent banner instead of
  // silently discarding your tap.
  scheduleRender(() => {
    const row = findCollectionRow(name);
    if(row){
      row.classList.toggle('inactive', !active);
      const toggleBtn = row.querySelector('.active-toggle');
      if(toggleBtn){
        toggleBtn.classList.toggle('is-on', active);
        toggleBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
      }
      const clRight = row.querySelector('.cl-right');
      if(clRight){
        let tag = clRight.querySelector('.owned-tag');
        if(!active && !tag){
          tag = document.createElement('span');
          tag.className = 'owned-tag';
          tag.textContent = 'Not owned';
          clRight.insertBefore(tag, clRight.firstChild);
        } else if(active && tag){
          tag.remove();
        }
      }
    }
    updateCollectionSummary();
    updateWatchOptions();
    renderStats();
  });
}

function exportSpreadsheet(){
  const msg = document.getElementById('exportMsg');
  if(typeof XLSX === 'undefined'){
    msg.textContent = 'Export library failed to load — check your connection and try again.';
    msg.classList.add('err');
    return;
  }
  msg.classList.remove('err');

  const logRows = [['Date Worn', 'Watch']];
  state.entries.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(e => {
    logRows.push([e.date, e.watch]);
  });

  const countByName = {};
  state.entries.forEach(e => countByName[e.watch] = (countByName[e.watch]||0) + 1);
  const collectionRows = [['Watch', 'In Collection', 'Times Worn', 'Icon Shape', 'Color']];
  state.collection.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(w => {
    collectionRows.push([w.name, w.active ? 'Yes' : 'No', countByName[w.name] || 0, w.shape, w.color]);
  });

  const wb = XLSX.utils.book_new();
  const logSheet = XLSX.utils.aoa_to_sheet(logRows);
  logSheet['!cols'] = [{ wch: 12 }, { wch: 55 }];
  const collSheet = XLSX.utils.aoa_to_sheet(collectionRows);
  collSheet['!cols'] = [{ wch: 55 }, { wch: 13 }, { wch: 11 }, { wch: 11 }, { wch: 9 }];
  XLSX.utils.book_append_sheet(wb, logSheet, 'Log');
  XLSX.utils.book_append_sheet(wb, collSheet, 'Collection');

  XLSX.writeFile(wb, `WristCheck-export-${todayStr()}.xlsx`);
  msg.textContent = 'Downloaded';
  setTimeout(() => { if(msg.textContent === 'Downloaded') msg.textContent = ''; }, 2500);
}

function normalizeImportedDate(val){
  if(val instanceof Date) return toIso(val);
  const s = String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(typeof val === 'number' && typeof XLSX !== 'undefined' && XLSX.SSF && XLSX.SSF.parse_date_code){
    const parsed = XLSX.SSF.parse_date_code(val);
    if(parsed) return toIso(new Date(parsed.y, parsed.m - 1, parsed.d));
  }
  const d = new Date(s);
  if(!isNaN(d.getTime())) return toIso(d);
  return s;
}

async function importSpreadsheet(file){
  const msg = document.getElementById('importMsg');
  msg.classList.remove('err');
  if(typeof XLSX === 'undefined'){
    msg.textContent = 'Import library failed to load — check your connection and try again.';
    msg.classList.add('err');
    return;
  }

  let wb;
  try{
    const buffer = await file.arrayBuffer();
    wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: true });
  }catch(err){
    console.error('import parse failed', err);
    msg.textContent = "Couldn't read that file — make sure it's a WristCheck export (.xlsx).";
    msg.classList.add('err');
    return;
  }

  const logSheet = wb.Sheets['Log'];
  const collSheet = wb.Sheets['Collection'];
  if(!logSheet || !collSheet){
    msg.textContent = "That doesn't look like a WristCheck export — missing the Log or Collection tab.";
    msg.classList.add('err');
    return;
  }

  const logRows = XLSX.utils.sheet_to_json(logSheet, { header: 1 });
  const collRows = XLSX.utils.sheet_to_json(collSheet, { header: 1 });

  // Collection: add any watch that doesn't already exist by name. Watches
  // already present are left exactly as they are on this device — an import
  // only ever adds, never overwrites a color/shape/active status you've
  // already set here.
  const existingNames = new Set(state.collection.map(w => w.name));
  let addedWatches = 0;
  for(let i = 1; i < collRows.length; i++){
    const row = collRows[i] || [];
    const name = row[0] ? String(row[0]).trim() : '';
    if(!name || existingNames.has(name)) continue;
    state.collection.push({
      name,
      color: row[4] ? String(row[4]).trim() : PALETTE[state.collection.length % PALETTE.length],
      shape: row[3] === 'digital' ? 'digital' : 'analog',
      active: row[1] === 'Yes'
    });
    existingNames.add(name);
    addedWatches++;
  }

  // Entries: add any date+watch pair that isn't already logged here. Never
  // removes or overwrites anything that already exists on this device.
  const existingKeys = new Set(state.entries.map(e => e.date + '|' + e.watch));
  let addedEntries = 0;
  for(let i = 1; i < logRows.length; i++){
    const row = logRows[i] || [];
    if(!row[0] || !row[1]) continue;
    const date = normalizeImportedDate(row[0]);
    const watch = String(row[1]).trim();
    const key = date + '|' + watch;
    if(existingKeys.has(key)) continue;
    state.entries.push({ id: uid(), date, watch });
    existingKeys.add(key);
    addedEntries++;
  }

  if(addedEntries === 0 && addedWatches === 0){
    msg.textContent = 'Nothing new in that file — already up to date.';
    return;
  }

  await storageSet(KEYS.entries, state.entries);
  await storageSet(KEYS.collection, state.collection);

  const parts = [];
  if(addedEntries) parts.push(`${addedEntries} new ${addedEntries === 1 ? 'entry' : 'entries'}`);
  if(addedWatches) parts.push(`${addedWatches} new ${addedWatches === 1 ? 'watch' : 'watches'}`);
  msg.textContent = `Imported ${parts.join(' and ')}.`;

  historyPage = 0;
  scheduleRender(renderAll);
}

function switchTab(tab){
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
}

/* ---------- init ---------- */
async function init(){
  await loadState();
  renderHeader();
  renderAll();
  startClock();
  document.getElementById('dateInput').value = todayStr();

  document.getElementById('logBtn').addEventListener('click', logEntry);
  document.getElementById('addWatchBtn').addEventListener('click', addWatch);
  document.getElementById('addWatchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addWatch(); }
  });
  document.getElementById('historyList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-del]');
    if(btn){ btn.blur(); deleteEntry(btn.dataset.del); }
  });
  document.getElementById('historyPager').addEventListener('click', (e) => {
    if(e.target.id === 'pagerNewer' && historyPage > 0){
      historyPage--; renderToday();
    }
    if(e.target.id === 'pagerOlder' && historyPage < maxHistoryPage()){
      historyPage++; renderToday();
    }
  });
  document.getElementById('collectionList').addEventListener('click', (e) => {
    const removeBtn = e.target.closest('[data-remove]');
    if(removeBtn){ removeBtn.blur(); removeWatch(removeBtn.dataset.remove); return; }
    const shapeBtn = e.target.closest('[data-shape-set]');
    if(shapeBtn){ shapeBtn.blur(); setShape(shapeBtn.dataset.watch, shapeBtn.dataset.shapeSet); return; }
    const toggleBtn = e.target.closest('[data-toggle-active]');
    if(toggleBtn){
      const newState = !toggleBtn.classList.contains('is-on');
      toggleBtn.blur();
      setActive(toggleBtn.dataset.toggleActive, newState);
    }
  });
  document.getElementById('collectionList').addEventListener('change', (e) => {
    const target = e.target;
    if(target.classList.contains('color-input')){
      const val = target.value;
      target.blur();
      setColor(target.dataset.watch, val);
    }
    if(target.classList.contains('name-input')){
      const val = target.value;
      target.blur();
      renameWatch(target.dataset.watch, val);
    }
  });
  document.getElementById('collectionList').addEventListener('keydown', (e) => {
    if(e.target.classList.contains('name-input') && e.key === 'Enter'){
      e.preventDefault();
      e.target.blur();
    }
  });
  document.getElementById('exportBtn').addEventListener('click', exportSpreadsheet);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(file) importSpreadsheet(file);
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
}

init();
</script>
</body>
